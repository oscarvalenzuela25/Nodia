    form.addEventListener('keydown', event => {

    const row=records.find(r=>r.id===Number(id));if(!row)return;
    openDialog('Acciones del movimiento','<div><strong>'+esc(row.description)+'</strong><p class="nd-muted">'+(row.type==='income'?'Ingreso':'Egreso')+' · '+money(row.amount)+'</p></div><div class="nd-menu"><button type="button" data-action="edit-row" data-id="'+row.id+'" class="cursor-interaction">'+icon('pencil')+'Editar'+(row.invoice?' desde factura':'')+'</button><button type="button" data-action="confirm-toggle" data-id="'+row.id+'" class="cursor-interaction">'+icon(row.active?'circle-pause':'circle-play')+(row.active?'Desactivar':'Activar')+'</button></div>');
  }
  function saveInvoice(form) {
    const data=new FormData(form);const cat=data.get('category');const amount=Number(data.get('amount'));
    if(!Number.isSafeInteger(amount)||amount<0||(cat&&amount<=0)){feedback('La categoría requiere un total positivo para registrar el egreso.');return;}
    if(!invoiceId){invoiceId='invoice-demo-'+(invoiceBook.size+1);invoiceMode='edit';}
    const current=records.find(row=>row.invoiceId===invoiceId);
    Object.assign(invoiceDraft,{code:data.get('code'),amount:String(amount),date:data.get('date'),category:cat,notes:data.get('notes'),active:data.get('active')==='on',provider:data.get('provider')});
    invoiceCategory=cat;invoiceBook.set(invoiceId,{...invoiceDraft});
    if(cat){
      if(current)Object.assign(current,{category:cat,amount,date:data.get('date'),active:current.withdrawn?true:current.active,withdrawn:false});
      else records.push({id:Math.max(...records.map(row=>row.id))+1,type:'expense',amount,date:data.get('date'),category:cat,description:'Compra a distribuidora',active:true,invoice:true,invoiceId,withdrawn:false});
    }else if(current)current.withdrawn=true;
    render();
    feedback(cat?'Factura guardada en la demostración · un único egreso vinculado.':current?'Factura guardada en la demostración · egreso retirado de Caja.':'Factura guardada en la demostración · sin egreso en Caja.');persist();
  }
  root.addEventListener('click',event=>{
    const nav=event.target.closest('[data-view]');if(nav){view=nav.dataset.view;render();persist();return;}
    const button=event.target.closest('button[data-action]');if(!button)return;
    const action=button.dataset.action;const id=button.dataset.id;
    if(action==='preview-cash'){if(quickCategoryContext)restoreCategoryOrigin(null);closeDialog();view='cash';render();}
    else if(action==='preview-drawer'){if(quickCategoryContext)restoreCategoryOrigin(null);closeDialog();view='cash';render();showCategories();}
    else if(action==='preview-quick-category'){if(quickCategoryContext)restoreCategoryOrigin(null);closeDialog();chooseInvoice('edit','invoice-demo-1');openQuickCategory(root.querySelector('#nd-invoice-form select[name="category"]'));}
    else if(action==='new-invoice')chooseInvoice('new');
    else if(action==='edit-demo-invoice')chooseInvoice('edit','invoice-demo-1');
    else if(action==='edit-unlinked-invoice')chooseInvoice('edit','invoice-demo-2');
    else if(action==='clear-category'){const select=button.closest('.nd-category-control').querySelector('select');select.value='';select.dispatchEvent(new Event('input',{bubbles:true}));select.dispatchEvent(new Event('change',{bubbles:true}));select.focus();}
    else if(action==='quick-category')openQuickCategory(button.closest('.nd-category-control').querySelector('select'));
    else if(action==='go-cash'){view='cash';render();persist();}
    else if(action==='filters')showFilters();
    else if(action==='categories'||action==='new-category')showCategories();
    else if(action==='edit-category')showCategories(id);
    else if(action==='toggle-category'){const cat=categories.find(c=>c.id===id);openDialog((cat.active?'Desactivar':'Activar')+' categoría','<p>'+esc(cat.name)+'</p><p class="nd-muted">Los movimientos existentes conservan su categoría y sus importes.</p><div class="nd-form-footer"><button type="button" class="nd-ghost cursor-interaction" data-action="categories">Cancelar</button><button type="button" class="nd-primary cursor-interaction" data-action="apply-category-toggle" data-id="'+id+'">Confirmar</button></div>');}
    else if(action==='apply-category-toggle'){const cat=categories.find(c=>c.id===id);cat.active=!cat.active;feedback('Estado de categoría actualizado en la demostración.');render();showCategories();}
    else if(action==='new-income')showMovement('income');
    else if(action==='new-expense')showMovement('expense');
    else if(action==='close-dialog')closeDialog();
    else if(action==='previous'){page=Math.max(1,page-1);cashParts();}
    else if(action==='next'){page++;cashParts();}
    else if(action==='row-menu')showRowMenu(id);
    else if(action==='edit-row'){const row=records.find(r=>r.id===Number(id));showMovement(row.type,id);}
    else if(action==='confirm-toggle'){const row=records.find(r=>r.id===Number(id));openDialog((row.active?'Desactivar':'Activar')+' movimiento','<p>'+esc(row.description)+'</p><p class="nd-muted">El cambio se reflejará en los totales de Caja y en el resumen del mes.</p><div class="nd-form-footer"><button type="button" class="nd-ghost cursor-interaction" data-action="close-dialog">Cancelar</button><button type="button" class="nd-primary cursor-interaction" data-action="apply-toggle" data-id="'+id+'">Confirmar</button></div>');}
    else if(action==='apply-toggle'){const row=records.find(r=>r.id===Number(id));row.active=!row.active;closeDialog();render();feedback('Estado del movimiento actualizado en la demostración.');persist();}
    else if(action==='clear-filter'){filter={category:'',from:today,to:today,activity:'active',search:''};page=1;closeDialog();render();persist();}
    else if(action==='help-invoice'){const help=root.querySelector('#nd-invoice-help');help.hidden=!help.hidden;button.setAttribute('aria-expanded',String(!help.hidden));}
    else if(action==='help-ocr'){const help=root.querySelector('#nd-ocr-help');help.hidden=!help.hidden;button.setAttribute('aria-expanded',String(!help.hidden));}
    else if(action==='save-ocr'){const selected=root.querySelector('#nd-ocr-category').value;feedback(selected?'Vista previa: se guardarían la factura y los productos con un único egreso en '+categoryName(selected)+'.':'Vista previa: se guardarían la factura y los productos sin egreso en Caja.');}
  });
  root.querySelector('#nd-section').addEventListener('change',event=>{view=event.target.value;render();persist();});
  root.addEventListener('keydown',event=>{
    if(overlay.hidden)return;
    if(event.key==='Escape'){event.preventDefault();closeDialog();}
    if(event.key==='Tab'){const controls=[...modal.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled&&!el.hidden);const first=controls[0],last=controls[controls.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  });
  function applyDesign(){root.style.setProperty('--nd-tint',design.tint+'%');root.style.setProperty('--nd-row-pad',design.density==='Compacta'?'10px':'15px');}
  render();applyDesign();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSlider(design,'tint',{label:'Intensidad del fondo de filas',min:3,max:15,step:1,unit:'%',reference:'--nd-tint'});tweak.addSelect(design,'density',{label:'Densidad de tabla',options:['Cómoda','Compacta'],reference:'--nd-row-pad'});}
})();
</script>
