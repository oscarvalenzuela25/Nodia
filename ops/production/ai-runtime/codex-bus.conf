<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:path=/run/nodia-codex/bus</listen>
  <auth>EXTERNAL</auth>
  <keep_umask/>
  <!-- No service directories: only systemd starts the credential daemon. -->
  <policy context="default">
    <allow user="nodia"/>
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
