# Nodia production API proxy; API/worker and isolated restore are gated separately.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 166.0.112.187;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://166.0.112.187$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 166.0.112.187;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/nodia-api-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodia-api-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NodiaTLS:10m;
    location = /tls-check {
        default_type text/plain;
        add_header Cache-Control no-store;
        return 200 "nodia-https-ok\n";
    }
    # f01: raw attachments <=20 MiB; invoice <=10 MiB + <=15 fields,
    # Busboy fieldSize default 1 MiB. 32 MiB is a transport envelope,
    # not a new file limit; backend DTO/policy/parser limits still apply.
    client_max_body_size 32m;
    client_body_timeout 60s;
    location ~ ^/api/v1(?:/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Idle-read transport budget: runtime run_seconds=600 + flush_seconds=10.
        proxy_read_timeout 610s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }
    location / { return 404; }
}
