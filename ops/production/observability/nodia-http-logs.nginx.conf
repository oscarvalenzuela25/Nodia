# Included at http scope. Routes, methods and all other text in the log are fixed values.
map "$https:$server_name:$request_uri" $nodia_log_route {
    default 0;
    ~^on:166[.]0[.]112[.]187:/api/v1/?(?:[?]|$) liveness;
    ~^on:166[.]0[.]112[.]187:/api/v1/auth(?:[/\?]|$) auth;
    ~^on:166[.]0[.]112[.]187:/api/v1/business(?:es)?(?:[/\?]|$) business;
    ~^on:166[.]0[.]112[.]187:/api/v1/teacher(?:[/\?]|$) teacher;
    ~^on:166[.]0[.]112[.]187:/api/v1/nodia-ai(?:[/\?]|$) nodia_ai;
    ~^on:166[.]0[.]112[.]187:/api/v1(?:[/\?]|$) api_other;
}

map $request_method $nodia_log_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}

log_format nodia_http escape=json
    '{"event":"http_request","method":"$nodia_log_method","route":"$nodia_log_route","status":$status,"duration_s":$request_time}';

access_log /var/log/nodia-observability/http.log nodia_http if=$nodia_log_route;
