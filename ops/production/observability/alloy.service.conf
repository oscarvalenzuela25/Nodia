[Service]
User=nodia-alloy
Group=nodia-alloy
StateDirectory=nodia-alloy
StateDirectoryMode=0750
WorkingDirectory=/var/lib/nodia-alloy
EnvironmentFile=
EnvironmentFile=/etc/nodia-alloy/metrics.env
LoadCredential=grafana-metrics-token:/etc/nodia-alloy/grafana-metrics-token
ExecStart=
ExecStart=/usr/bin/alloy run --disable-reporting --server.http.listen-addr=127.0.0.1:12345 --server.http.enable-pprof=false --server.http.disable-support-bundle --storage.path=/var/lib/nodia-alloy /etc/nodia-alloy/conf.d
