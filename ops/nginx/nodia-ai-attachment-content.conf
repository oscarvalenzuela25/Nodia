# Include inside the API virtual server, before its ordinary /api/v1 location.
# NodiaAI uploads are one raw octet-stream per request, not multipart.
# The backend enforces the 20 MiB intent/reservation and 40 MiB message sum.
# Keep the virtual server's existing body limit for every other route.
location ~* "^/api/v1/nodia-ai/attachments/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/content$" {
    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_buffering off;
}
