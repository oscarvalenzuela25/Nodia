name: Report Nodia delivery to Grafana
run-name: Report delivery ${{ inputs.cd_run_id }}

on:
  workflow_dispatch:
    inputs:
      cd_run_id:
        description: Original production delivery run ID
        type: string
        required: true

permissions: {}
concurrency:
  group: nodia-delivery-report-${{ inputs.cd_run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the completed production delivery
    if: >-
      github.repository == 'oscarvalenzuela25/Nodia' &&
      github.ref == 'refs/heads/development' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      actions: read
    outputs:
      cd_run_id: ${{ steps.delivery.outputs.cd_run_id }}
      conclusion: ${{ steps.delivery.outputs.conclusion }}
    steps:
      - name: Validate the source and reject earlier report requests for it
        id: delivery
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 0
          script: |
            const cdRunId = context.payload.inputs?.cd_run_id;
            const repository = 'oscarvalenzuela25/Nodia';
            if (!/^[1-9][0-9]{0,19}$/.test(cdRunId ?? '')) {
              core.setFailed('invalid_delivery_run_id');
              return;
            }
            const request = { timeout: 10000 };
            try {
              for (let check = 0; check < 15; check++) {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  ...context.repo, run_id: cdRunId, request,
                });
                if (String(run.id) !== cdRunId || run.repository?.full_name !== repository ||
                    run.head_repository?.full_name !== repository || run.head_repository.id !== run.repository.id ||
                    run.path !== '.github/workflows/cd.yml' || run.event !== 'workflow_dispatch' ||
                    run.head_branch !== 'master' || run.run_attempt !== 1) {
                  core.setFailed('trusted_production_delivery_required');
                  return;
                }
                if (run.status === 'completed') {
                  if (!['success', 'failure'].includes(run.conclusion)) {
                    core.setFailed('reportable_delivery_conclusion_required');
                    return;
                  }
                  const title = `Report delivery ${cdRunId}`;
                  for (let page = 1; page <= 10; page++) {
                    const { data: history } = await github.rest.actions.listWorkflowRuns({
                      ...context.repo, workflow_id: 'cd-observability.yml', event: 'workflow_dispatch',
                      branch: 'development', created: '>=' + run.created_at, per_page: 100, page, request,
                    });
                    if (history.workflow_runs.some(report => report.run_number < context.runNumber && report.display_title === title)) {
                      core.info('Delivery already has a report request');
                      return;
                    }
                    if (history.workflow_runs.length < 100) {
                      core.setOutput('cd_run_id', cdRunId);
                      core.setOutput('conclusion', run.conclusion);
                      return;
                    }
                  }
                  core.setFailed('delivery_reporting_history_incomplete');
                  return;
                }
                await new Promise(resolve => setTimeout(resolve, 4000));
              }
              core.setFailed('source_delivery_still_pending');
            } catch {
              core.setFailed('delivery_reporting_source_unavailable');
            }

  report:
    needs: verify
    if: needs.verify.outputs.cd_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    environment:
      name: cd-observability
      deployment: false
    steps:
      - name: Check out the reporter from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve only the sanitized delivery receipt from the completed run
        id: receipt
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: delivery-receipt-${{ needs.verify.outputs.cd_run_id }}-1
          path: ${{ runner.temp }}/nodia-delivery-receipt
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify.outputs.cd_run_id }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.receipt.outcome == 'success'
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Send the delivery event to Loki
        if: steps.receipt.outcome == 'success'
        continue-on-error: true
        env:
          NODIA_CD_LOKI_URL: ${{ vars.NODIA_CD_LOKI_URL }}
          NODIA_CD_LOKI_USER: ${{ vars.NODIA_CD_LOKI_USER }}
          NODIA_CD_LOKI_TOKEN: ${{ secrets.NODIA_CD_LOKI_TOKEN }}
          NODIA_CD_RUN_ID: ${{ needs.verify.outputs.cd_run_id }}
          NODIA_CD_RUN_ATTEMPT: '1'
          NODIA_CD_RUN_CONCLUSION: ${{ needs.verify.outputs.conclusion }}
        run: node ops/ci/cd-observability.mjs "$RUNNER_TEMP/nodia-delivery-receipt/delivery-receipt.json"
