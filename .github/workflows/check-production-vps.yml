name: Check production VPS access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-vps:
    name: Verify restricted SSH access without deploying
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Require a manual master run
        shell: bash
        run: test "$GITHUB_EVENT_NAME" = workflow_dispatch && test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - name: Verify the pinned server and the restricted identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: node ops/ci/check-vps-access.mjs
