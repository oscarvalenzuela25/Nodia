<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Descargas de Teacher · Nodia</title>
  </head>
  <body>
    <main>
      <header class="reader-header">
        <div class="reader-nav">
          <a class="back-link" id="teacher-home" href="/nodia-teacher">Volver a Teacher</a>
          <span id="network-state" class="network-state" hidden></span>
        </div>
        <h1 id="page-title" tabindex="-1">Descargas de Teacher</h1>
      </header>
      <div class="reader-notices">
        <p id="checking" hidden></p>
        <p id="message" role="status"></p>
        <p id="failure" role="alert"></p>
        <button id="retry" type="button" hidden></button>
      </div>
      <ul id="downloads" aria-labelledby="page-title" hidden></ul>
      <article id="lesson" aria-labelledby="lesson-title" hidden></article>
      <noscript>Activa JavaScript para abrir tus descargas.</noscript>
    </main>
    <script type="module" src="/src/modules/teacher/offline/reader.ts"></script>
  </body>
</html>
