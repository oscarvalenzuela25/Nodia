<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover, interactive-widget=resizes-visual" />
    <title>Nodia - Tools</title>
  </head>
  <body>
    <script>
      // Prevent third-party browser extensions (e.g. daily.dev companion) from bubbling errors to Vite dev overlay
      window.addEventListener('error', function (event) {
        if (
          event.message?.includes('daily-companion-app') ||
          event.filename?.includes('chrome-extension://')
        ) {
          event.stopImmediatePropagation();
        }
      });
    </script>
    <div id="root"></div>
    <!-- Dummy element to prevent chrome extension 'daily.dev' companion from throwing react-modal selector errors -->
    <daily-companion-app style="display: none;"></daily-companion-app>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
