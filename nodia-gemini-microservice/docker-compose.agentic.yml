# Explicit override after preparing persistent credentials storage for the Linux service user.
# Authenticate through Settings IA > Gemini > Agentic; verify on the target VPS before production.
# docker compose -f docker-compose.yml -f docker-compose.agentic.yml up -d --build
services:
  nodia-gemini-microservice:
    volumes:
      - ./agentic_profile:/home/nodia/agentic_profile
    environment:
      ANTIGRAVITY_CLI_PATH: /opt/nodia/antigravity-cli/1.3.1/agy
      ANTIGRAVITY_CLI_SHA512: f57ad0a04c93e1d13b86bd13c4f35b6577bc0557e6bfd718e9f3a2bdb4504240113f6bbcfefad9f039eb1d5e7e23e0a2623b4b7687882eca86954e485ad9f9c2
      ANTIGRAVITY_CLI_HOME: /home/nodia/agentic_profile
      ANTIGRAVITY_CLI_TIMEOUT_SECONDS: "240"
