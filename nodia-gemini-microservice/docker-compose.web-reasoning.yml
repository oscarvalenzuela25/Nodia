# Opt-in observed profiles. No session data or built-in model catalog.
services:
  nodia-gemini-microservice:
    environment:
      GEMINI_WEB_REASONING_PROFILES_PATH: /app/config/web_reasoning_profiles.json
    volumes:
      - type: bind
        source: ${GEMINI_WEB_REASONING_PROFILES_HOST_PATH:?Configure an absolute path to observed reasoning profiles}
        target: /app/config/web_reasoning_profiles.json
        read_only: true
        bind:
          create_host_path: false
